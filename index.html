<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f5;
            color: #18181b;
        }
        header {
            background-color: #ffffff;
            padding: 1.25rem 2rem;
            border-bottom: 1px solid #e4e4e7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: 700;
            font-size: 1.25rem;
        }
        nav a {
            margin-left: 1.5rem;
            text-decoration: none;
            color: #52525b;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #09090b;
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        .internship-btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .internship-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Your Organization</div>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/services">Services</a>
            <!-- Header link to the dedicated internships page -->
            <a href="/internships">Careers</a>
        </nav>
    </header>

    <main>
        <!-- Direct link to the Google Form, no body text -->
        <a href="https://forms.gle/z36YkCP1PyA6cdMc6" target="_blank" rel="noopener noreferrer" class="internship-btn">Internships</a>
    </main>

</body>
</html>
